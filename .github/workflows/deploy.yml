name: Deploy to Alfahosting

on:
  push:
    branches:
      - claude/ms-media-website-gxf5qt
  workflow_dispatch: {}

jobs:
  ftp-deploy:
    name: FTP-Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync files via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: host201.alfahosting-server.de
          port: 21
          protocol: ftps
          username: h150458_claude
          password: ${{ secrets.FTP }}
          local-dir: ./
          server-dir: /codeundlicht/
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.claude/**
            **/README.md
            **/node_modules/**
            assets/video/VideoproduktionKaerntenStabentheiner.mp4
            assets/video/VideoproduktionKaerntenStabentheiner - Kopie.mp4
